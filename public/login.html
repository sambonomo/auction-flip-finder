<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1419">
<title>Sign in · Auction Flip Finder</title>
<link rel="icon" href="/icon.svg">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1419;color:#e6edf3;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:#171e26;border:1px solid #27323e;border-radius:16px;padding:24px 20px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:42px;height:42px;border-radius:11px;background:#f5a524;color:#1a1300;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:#8b98a5}
label{display:block;font-size:13px;color:#8b98a5;margin:14px 0 6px}
input{width:100%;padding:13px 12px;font-size:16px;color:#e6edf3;background:#0f1419;border:1px solid #33414f;border-radius:10px;outline:none}
input:focus{border-color:#f5a524}
button{width:100%;margin-top:20px;padding:14px;font-size:16px;font-weight:700;color:#1a1300;background:#f5a524;border:0;border-radius:10px;cursor:pointer}
.err{display:none;margin-top:14px;padding:10px 12px;font-size:14px;color:#ffb4a8;background:#3a1d1a;border:1px solid #6b2c25;border-radius:10px}
.err.on{display:block}
</style>
</head>
<body>
<form method="post" action="/api/login" autocomplete="on">
  <div class="brand"><div class="logo">$</div><div><h1>Auction Flip Finder</h1><div class="sub">Team sign in</div></div></div>
  <label for="u">Username</label>
  <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert">That username or password is not right. Try again.</div>
  <button type="submit">Login</button>
</form>
<script>if(/[?&]e=1/.test(location.search))document.getElementById('err').classList.add('on');</script>
</body>
</html>
